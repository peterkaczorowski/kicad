/*
 * backend_bom.proto  (CG_BOM)
 *
 * Pared BOM surface. KiCad ships no BOM transformation workflow; this group
 * only lets a backend expose BOM rows and its BOM vocabulary. Any transform
 * lives in the backend or an IPC client.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message BomLine
{
  string                       item_id    = 1;
  string                       reference  = 2;
  uint32                       quantity   = 3;
  kiapi.workspace.AttributeSet attributes = 4;
}

message Bom
{
  string           bom_id   = 1;
  string           bom_type = 2;
  repeated BomLine lines    = 3;
}

message GetBomSchemaRequest {}

message GetBomSchemaReply
{
  kiapi.workspace.Schema         schema = 1;
}

message GetBomRequest { string item_id = 1; }

message GetBomReply
{
  Bom                            bom   = 1;
}
