/*
 * backend_shared_libs.proto  (CG_SHARED_LIBRARIES)
 *
 * Workspace-owned shared component libraries. The framework adds project-scoped
 * library-table entries tagged with the binding id and removes only those on
 * unbind.
 */

syntax = "proto3";

package kiapi.mdw;

enum SharedLibType
{
  SLT_SYMBOL   = 0;
  SLT_FOOTPRINT = 1;
  SLT_MODEL_3D = 2;
}

message SharedLibrary
{
  string        library_id   = 1;
  string        display_name = 2;
  SharedLibType type         = 3;
  string        uri          = 4;
  string        version      = 5;
}

message ListSharedLibrariesRequest {}

message ListSharedLibrariesReply
{
  repeated SharedLibrary         libraries = 1;
}

message DownloadSharedLibraryRequest
{
  string library_id = 1;
  string local_path = 2;
}

message DownloadSharedLibraryReply {}
