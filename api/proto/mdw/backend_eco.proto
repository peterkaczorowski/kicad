/*
 * backend_eco.proto  (CG_ECO)
 *
 * Pared ECO surface. KiCad ships no ECO routing or approval flow; this group
 * only lets a backend surface ECO records and its ECO vocabulary. state and
 * eco_type are backend display strings.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message Eco
{
  string          eco_id            = 1;
  string          title             = 2;
  string          eco_type          = 3;
  string          state             = 4;
  string          author            = 5;
  repeated string affected_item_ids = 6;
}

message GetEcoSchemaRequest {}

message GetEcoSchemaReply
{
  kiapi.workspace.Schema         schema = 1;
}

message GetEcoRequest { string eco_id = 1; }

message GetEcoReply
{
  Eco                            eco   = 1;
}
