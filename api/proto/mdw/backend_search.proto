/*
 * backend_search.proto  (CG_SEARCH)
 *
 * Backend-declared search fields and paged item search.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message SearchField
{
  string                  field_id     = 1;
  string                  display_name = 2;
  kiapi.workspace.AttrType type         = 3;
  repeated string         enum_values  = 4;
}

message GetSearchSchemaRequest {}

message GetSearchSchemaReply
{
  repeated SearchField           fields = 1;
}

message SearchFilter
{
  string field_id = 1;
  string value    = 2;
}

message SearchRequest
{
  string                text       = 1;
  repeated SearchFilter filters    = 2;
  uint32                page_size  = 3;
  string                page_token = 4;
}

message SearchReply
{
  repeated kiapi.workspace.ItemInfo items           = 1;
  string                            next_page_token = 2;
}
