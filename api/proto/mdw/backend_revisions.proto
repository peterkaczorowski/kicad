/*
 * backend_revisions.proto  (CG_REVISIONS)
 *
 * Revision history and revision download. The framework downloads two
 * revisions into its cache to drive the visual diff.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message GetRevisionHistoryRequest { string item_id = 1; }

message GetRevisionHistoryReply
{
  repeated kiapi.workspace.Revision revisions = 1;
}

message DownloadRevisionRequest
{
  string item_id     = 1;
  string revision_id = 2;
  string local_path  = 3;
}

message DownloadRevisionReply {}
