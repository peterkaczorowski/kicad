/*
 * mdw_envelope.proto
 *
 * The backend channel envelope. KiCad spawns a backend executable and speaks
 * this protocol over nng REQ/REP (control) and a reversed REQ/REP (events).
 * There are no proto service blocks: dispatch is method-per-message plus this
 * envelope carrying a google.protobuf.Any payload, matching KiCad's existing
 * API_HANDLER model.
 */

syntax = "proto3";

package kiapi.mdw;

import "google/protobuf/any.proto";
import "workspace/workspace_types.proto";

/*
 * Control-channel request (KiCad -> backend). channel_token is the per-spawn
 * secret echoed in every envelope both directions. request_id ties progress and
 * CancelRequest to an in-flight call.
 */
message MdwRequest
{
  kiapi.workspace.Version protocol_version = 1;
  string                  channel_token    = 2;
  string                  request_id       = 3;

  google.protobuf.Any     payload          = 4;
}

/*
 * Control-channel response (backend -> KiCad).
 */
message MdwResponse
{
  string                         channel_token = 1;
  string                         request_id    = 2;

  // The single error channel for the backend call. WE_OK on success. On error
  // the payload may be empty. Reply payloads carry no error field of their own;
  // the proxy reads the outcome here, matching KiCad's API_HANDLER model where
  // status rides the envelope and the payload is pure data.
  kiapi.workspace.WorkspaceError error         = 3;

  google.protobuf.Any            payload       = 4;
}

/*
 * Event-channel message (backend -> KiCad), pushed as a REQ and ACKed per
 * message. Delivery is authoritative for lock and lifecycle tracking, so the
 * channel is reliable REQ/REP rather than lossy pub/sub.
 */
message PublishEvent
{
  string                         channel_token = 1;
  kiapi.workspace.EventEnvelope  event         = 2;
}

message PublishEventAck
{
  string channel_token = 1;
  uint64 seq           = 2;
}
