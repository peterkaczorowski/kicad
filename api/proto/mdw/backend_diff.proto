/*
 * backend_diff.proto  (CG_DIFF)
 *
 * Backend-side semantic compare. This produces a server-computed change
 * summary for the history dialog. The framework's visual schematic/PCB diff
 * needs only CG_REVISIONS (two downloaded revisions); it does not need this
 * group.
 */

syntax = "proto3";

package kiapi.mdw;

enum ChangeType
{
  CT_UNKNOWN  = 0;
  CT_ADDED    = 1;
  CT_REMOVED  = 2;
  CT_MODIFIED = 3;
  CT_MOVED    = 4;
}

message ChangeEntry
{
  ChangeType change_type = 1;
  string     element_id  = 2;
  string     description = 3;
}

message GetChangeSummaryRequest
{
  string item_id    = 1;
  string revision_a = 2;
  string revision_b = 3;
}

message GetChangeSummaryReply
{
  repeated ChangeEntry           changes = 1;
}
