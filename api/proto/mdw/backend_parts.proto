/*
 * backend_parts.proto  (CG_PARTS)
 *
 * Managed part identity lookup and search.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message GetPartRequest { string part_id = 1; }

message GetPartReply
{
  kiapi.workspace.Part           part  = 1;
}

message SearchPartsRequest
{
  string text       = 1;
  uint32 page_size  = 2;
  string page_token = 3;
}

message SearchPartsReply
{
  repeated kiapi.workspace.Part  parts           = 1;
  string                         next_page_token = 2;
}
