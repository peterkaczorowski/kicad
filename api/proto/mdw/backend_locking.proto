/*
 * backend_locking.proto  (CG_LOCKING)
 *
 * Per-user exclusive locks. Independent of lifecycle category.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message LockRequest
{
  string item_id        = 1;
  string idempotency_id = 2;
}

message UnlockRequest
{
  string item_id        = 1;
  bool   force          = 2; // Administrator override of another user's lock
  string idempotency_id = 3;
}

message LockReply
{
  kiapi.workspace.LockInfo       lock  = 1;
}

message GetLockInfoRequest { string item_id = 1; }

message GetLockInfoReply
{
  kiapi.workspace.LockInfo       lock  = 1;
}
