/*
 * backend_forge.proto  (CG_FORGE)
 *
 * Hosted-Git review and merge-request state surfaced to the standard UI. state
 * is a backend display string.
 */

syntax = "proto3";

package kiapi.mdw;

message ForgeInfo
{
  string provider      = 1;
  string repo_url      = 2;
  bool   authenticated = 3;
}

message MergeRequest
{
  string id         = 1;
  string title      = 2;
  string author     = 3;
  string source_ref = 4;
  string target_ref = 5;
  string state      = 6;
  string url        = 7;
}

message GetForgeInfoRequest {}

message GetForgeInfoReply
{
  ForgeInfo                      info  = 1;
}

message ListMergeRequestsRequest { string item_id = 1; }

message ListMergeRequestsReply
{
  repeated MergeRequest          requests = 1;
}
