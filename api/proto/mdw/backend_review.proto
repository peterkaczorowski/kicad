/*
 * backend_review.proto  (CG_REVIEW)
 *
 * Pared review surface. KiCad ships no design-review canvas; this group only
 * lets a backend surface review records and its review vocabulary. state is a
 * backend display string.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message Review
{
  string          review_id    = 1;
  string          title        = 2;
  string          state        = 3;
  string          author       = 4;
  repeated string reviewer_ids = 5;
  string          revision_id  = 6;
}

message GetReviewSchemaRequest {}

message GetReviewSchemaReply
{
  kiapi.workspace.Schema         schema = 1;
}

message GetReviewRequest { string review_id = 1; }

message GetReviewReply
{
  Review                         review = 1;
}
