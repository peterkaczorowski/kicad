/*
 * backend_lifecycle.proto  (CG_LIFECYCLE)
 *
 * Transition an item between backend custom states. The backend reports the
 * resulting universal category; the framework consults only the category.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message ValidTransition
{
  string                          target_state_id  = 1;
  string                          display_name      = 2;
  string                          description       = 3;
  kiapi.workspace.LifecycleCategory target_category = 4;
  bool                            requires_comment  = 5;
}

message GetAvailableTransitionsRequest { string item_id = 1; }

message GetAvailableTransitionsReply
{
  repeated ValidTransition       transitions = 1;
}

message TransitionLifecycleRequest
{
  string item_id         = 1;
  string target_state_id = 2;
  string comment         = 3;
  string idempotency_id  = 4;
}

message TransitionLifecycleReply
{
  string                            new_state_id = 1;
  kiapi.workspace.LifecycleCategory new_category = 2;
}
