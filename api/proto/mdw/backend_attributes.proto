/*
 * backend_attributes.proto  (CG_ATTRIBUTES)
 *
 * Read and write the typed metadata declared by the item schema.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message GetAttributesRequest { string item_id = 1; }

message GetAttributesReply
{
  kiapi.workspace.AttributeSet   attributes = 1;
}

message SetAttributesRequest
{
  string                       item_id        = 1;
  kiapi.workspace.AttributeSet attributes     = 2;
  string                       idempotency_id = 3;
}

message SetAttributesReply {}
