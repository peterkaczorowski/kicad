syntax = "proto3";

package kiapi.schematic.types;

import "common/types/base_types.proto";

enum SchematicLayer
{
  SL_UNKNOWN = 0;
}

/// Represents a schematic line segment, which may be a wire, bus, or graphical line
message Line
{
  kiapi.common.types.KIID    id     = 1;
  kiapi.common.types.Vector2 start  = 2;
  kiapi.common.types.Vector2 end    = 3;

  /**
   * One of: LAYER_BUS, LAYER_WIRE, LAYER_NOTES
   */
  SchematicLayer layer = 4;
}

message Text
{
  kiapi.common.types.Text text = 1;
}

message LocalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message GlobalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message HierarchicalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

message DirectiveLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
}

enum SheetPinSide
{
  SPS_UNKNOWN = 0;
  SPS_LEFT = 1;
  SPS_RIGHT = 2;
  SPS_TOP = 3;
  SPS_BOTTOM = 4;
}

enum SheetPinShape
{
  SPH_UNKNOWN = 0;
  SPH_INPUT = 1;
  SPH_OUTPUT = 2;
  SPH_BIDIRECTIONAL = 3;
  SPH_TRISTATE = 4;
  SPH_PASSIVE = 5;
}

// Coordinates are nanometers, like common.types.Vector2 (not schematic internal units).
message SheetPin
{
  kiapi.common.types.KIID id = 1;
  string name = 2;
  kiapi.common.types.Vector2 position = 3;
  SheetPinSide side = 4;
  SheetPinShape shape = 5;
  kiapi.common.types.KIID sheet_id = 6;
}

// A hierarchical sheet symbol on the requested parent page.
message Sheet
{
  kiapi.common.types.KIID id = 1;
  string name = 2;
  string filename = 3;
  kiapi.common.types.Vector2 position = 4;
  kiapi.common.types.Vector2 size = 5;
  repeated SheetPin pins = 6;
}

// A connectivity snapshot is scoped to one open schematic hierarchy. Revisions
// change when the serialized connectivity/model metadata changes, not on repaint.
message NetMember
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.DocumentSpecifier document = 2;
  string kind = 3; // pin, wire, label, global_label, hierarchical_label, sheet_pin, ...
  kiapi.common.types.Vector2 position = 4;
  kiapi.common.types.KIID symbol_id = 5;
  string reference = 6; // physical reference, without unit suffix
  int32 unit = 7;
  string pin_number = 8;
  string pin_name = 9;
  string electrical_type = 10; // canonical model type; no inference from connectivity
  string value = 11;
  string text = 12;
  bool dangling = 13;
  bool no_connect = 14; // explicit NC marker or no_connect electrical pin type
  kiapi.common.types.Vector2 end_position = 15; // wire endpoint
}

message SchematicNet
{
  string id = 1; // valid only within session_id + revision
  string name = 2; // KiCad fully qualified resolved name
  repeated string aliases = 3; // candidate driver names, not additional shorts
  repeated NetMember members = 4;
  bool is_bus = 5;
  repeated string bus_member_ids = 6; // leaf nets of vectors/groups/aliases
}

message ConnectivitySnapshot
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string session_id = 2;
  uint64 revision = 3;
  repeated SchematicNet nets = 4;
}

message SymbolPinConnection
{
  NetMember pin = 1;
  repeated string net_ids = 2;
}

message ConnectivityIssue
{
  string code = 1;
  string description = 2;
  string severity = 3; // info, warning, error
  repeated NetMember items = 4;
  repeated string net_ids = 5;
}
